[project]
name = "aios"
version = "2.0.0"
description = "Personal assistant core: pluggable chat channels and senders, human-in-the-loop approvals, Claude agents."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.187",
    "dependency-injector>=4.46",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "aiohttp>=3.14.5",
    "slack-bolt>=1.21",
    # Teams Socket Mode is a preview whose API may change: kept to one minor version.
    "microsoft-teams-apps>=2.2.1,<2.3",
    "croniter>=7.0.0",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=44",
    "tzdata>=2026.6",
    "ruamel-yaml>=0.18",
    "jsonschema>=4.23",
    "pypdf>=6.1,<7.1",
    "pypdfium2>=5.15,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[project.scripts]
aios = "aios.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aios"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
