[project]
name = "aios"
version = "2.0.0"
description = "Personal assistant core: pluggable chat channels and senders, human-in-the-loop approvals, Claude agents."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.81",
    "dependency-injector>=4.46",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "aiohttp>=3.11",
    "slack-bolt>=1.21",
    "croniter>=6.2.4",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "tzdata>=2026.5",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
aios = "aios.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aios"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
