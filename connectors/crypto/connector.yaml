description: >-
  Buy/hold/sell signals for crypto coins, and BTC/ETH spot orders on Kraken in CHF
  inside hard limits. Every order is approved by a human first; one the limits
  refuse is not even asked. Needs the variables KRAKEN_API_KEY and
  KRAKEN_API_SECRET for orders and the balance (a key without withdrawal rights);
  signals and quotes work without.
env:
  KRAKEN_API_KEY: ${KRAKEN_API_KEY}
  KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}
approval:
  always: [trade]
  preflight: [trade]
# The trading limits, checked before an order is put to you and again right
# before it is placed. Keep this in step with trade_limits.py (a test checks it).
settings:
  type: object
  properties:
    pairs:
      type: object
      additionalProperties: {type: string}
      default: {BTC: XBTCHF, ETH: ETHCHF}
      description: The coins that may be traded, and their Kraken CHF pair.
    min_chf:
      type: number
      default: 10
      description: The smallest order, in CHF.
    max_chf_per_order:
      type: number
      default: 200
      description: The largest single order, in CHF.
    max_chf_per_day:
      type: number
      default: 500
      description: All orders of one day together, in CHF, counted in ai-os's timezone.
    max_orders_per_day:
      type: integer
      default: 5
      description: How many orders one day may have.
    cooldown_seconds:
      type: integer
      default: 60
      description: How long after an order before the next one.
    taker_fee_rate:
      type: number
      default: 0.004
      description: Only for estimates; the real fee comes back from Kraken.
