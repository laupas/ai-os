# A starting point: put this file in an empty folder, create the secrets key (below),
# run `docker compose up -d` and open http://localhost:8080. Everything else is set up
# in the console.
#
# The secrets key is required and lives outside the data: in a .env next to this
# file, which docker compose reads by itself. Once, and save the key in your password
# manager (without it the stored secrets cannot be read):
#   echo "AIOS_SECRETS_KEY=$(openssl rand -base64 48)" > .env
#
# The console starts without a login (pick a user): set one under Settings → Login,
# or put a login proxy in front, before anyone else can reach port 8080 (see README).
services:
  ai-os:
    image: ghcr.io/laupas/ai-os:latest
    # To build from a clone of the repository instead:
    # build: .
    container_name: ai-os
    restart: unless-stopped
    # Optional: channel tokens and the rest from the same .env (see .env.example);
    # everything but the secrets key can also be set in the console.
    # env_file: .env
    environment:
      # Required: encrypts the secrets ai-os stores. Replacing it: Settings → Security.
      AIOS_SECRETS_KEY: ${AIOS_SECRETS_KEY:?create it first, see the top of this file}
      # Only while replacing the key: the one before.
      AIOS_SECRETS_KEY_PREVIOUS: ${AIOS_SECRETS_KEY_PREVIOUS:-}
      AIOS_DATA_DIR: /data
      # Decrypted copies of ${file:NAME} variables: in RAM only (the tmpfs below).
      AIOS_VARIABLE_FILES_DIR: /run/aios-files
      AIOS_LOG_LEVEL: INFO
    volumes:
      - ./data:/data
      # A notes vault for the second-brain agent; also add /vault to files.write_roots.
      # - /path/to/your/vault:/vault
    tmpfs:
      - /run/aios-files:uid=1000,gid=1000,mode=0700
    ports:
      # Loopback only: reach it through your proxy, or directly on this machine.
      - "127.0.0.1:8080:8080"

  # A browser for the Playwright connector from the Store (the ai-os image has none).
  # ai-os reaches it at http://playwright-mcp:8931/mcp; keep its port unpublished:
  # whoever reaches it can drive the browser.
  # playwright-mcp:
  #   image: mcr.microsoft.com/playwright/mcp:v0.0.86
  #   container_name: playwright-mcp
  #   restart: unless-stopped
  #   init: true
  #   entrypoint: ["node", "/app/cli.js"]
  #   command: [--headless, --browser=chromium, --no-sandbox, --isolated,
  #             --host=0.0.0.0, --port=8931, --allowed-hosts=playwright-mcp:8931]

