# Weekly update pull requests for every kind of dependency, minor and patch
# versions grouped into one per ecosystem. Each runs CI; none is merged by itself.
# Security updates come at once, outside this schedule (repository setting).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      console:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors are never long-term support; the console builds on LTS.
      - dependency-name: node
        versions: [">=23 <24", ">=25 <26", ">=27 <28", ">=29 <30"]
