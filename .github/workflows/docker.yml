# Tests every push and pull request; from main and from version tags (v2.1.0) it
# also builds the image for amd64 and arm64 and pushes it to the GitHub Container
# Registry as ghcr.io/<owner>/ai-os, with an SBOM and build provenance attached.
# The image is scanned with Trivy before it is pushed: a critical vulnerability
# that has a fix stops the push; everything from high up shows under Security.
#
#   main      -> :latest, :main, :sha-<commit>
#   v2.1.0    -> :2.1.0, :2.1
name: CI and image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check aios tests
      - run: uv run ruff format --check aios tests
      - run: uv run pytest -q

  # The Deploy to Azure button loads azuredeploy.json: it must be main.bicep compiled.
  azure-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/azure/build.sh
      - run: |
          git diff --exit-code deploy/azure/azuredeploy.json || {
            echo "::error file=deploy/azure/azuredeploy.json::out of date: run deploy/azure/build.sh and commit it"
            exit 1
          }

  image:
    needs: [test, azure-template]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-os
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # One platform, loaded locally, to scan before anything is pushed; the
      # multi-platform build below reuses its cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ai-os:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned to its commit
        with:
          image-ref: ai-os:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Scan the image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned to its commit
        with:
          image-ref: ai-os:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
