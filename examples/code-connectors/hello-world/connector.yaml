# The manifest of a code connector: what it is, what it needs, what may be set,
# and which of its tools a human approves first. ai-os reads it on every turn.
description: >-
  Hello world, the example code connector. Greets, counts how often, and shouts
  after asking: everything a code connector can do, in one small server.

# The values it needs. The console asks for them on the connector and stores them
# as Variables (a secret one encrypted), ai-os's environment as fallback. Each
# reaches the server under its own name; nothing else from ai-os's environment does.
# (`env:` can still pass more, with `${NAME}` filled in from the Variables.)
variables:
  - variable: HELLO_TOKEN
    label: Hello token
    hint: Any text; the server only says whether it is set.
    required: false

# A human approves `shout` every time. Before that, ai-os runs
# `server.py preflight shout <arguments>`, and the server may refuse it outright
# or word the question.
approval:
  always: [shout]
  preflight: [shout]

# The settings, as a JSON schema with defaults. The console draws a form from it,
# and the server reads them from AIOS_CONNECTOR_SETTINGS. `x-locked: true` keeps a
# setting from agents: only an administrator changes it, in the console. That is
# the place for limits that must hold.
settings:
  type: object
  properties:
    greeting:
      type: string
      default: Hello
      description: Put before every name.
    max_shout_length:
      type: integer
      default: 20
      x-locked: true
      description: The longest text it will shout; longer is refused before anyone is asked.
